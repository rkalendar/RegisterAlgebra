name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Worked example of Section 9
        run: python rau.py
      - name: Test suite
        run: python -m unittest discover tests -v
      - name: Exhaustive and differential experiments
        run: python reproduce_results.py e1 e2 e3 e4
