name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # Python 3.8 is not built for the Ubuntu 26.04 image behind
          # ubuntu-latest, so the minimum supported version runs on 24.04.
          - os: ubuntu-24.04
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Worked example of Section 9
        run: python rau.py
      - name: Test suite
        run: python -m unittest discover tests -v
      - name: Exhaustive and differential experiments
        run: python reproduce_results.py e1 e2 e2t e3 e4
